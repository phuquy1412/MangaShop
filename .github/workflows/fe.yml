# Frontend CI/CD pipeline targeting Vercel
#+------------------------------------------------------
# This workflow builds the React/Vite frontend and deploys it to Vercel
# using the official Vercel action.  Ensure you provide the following
# secrets in the repository settings:
#   - VERCEL_TOKEN       (a personal token from your Vercel account)
#   - VERCEL_ORG_ID      (your Vercel organization id)
#   - VERCEL_PROJECT_ID  (the project id for this frontend app)

name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend

